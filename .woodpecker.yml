# Woodpecker CI, mirroring the test and build jobs of
# .github/workflows/docker-image.yml (publishing stays on GitHub).
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: pull_request

steps:
  secrets-scan:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - gitleaks detect --no-git --source . --no-banner --redact --exit-code 1

  mojibake:
    image: python:3.15-slim@sha256:8c13a3f37a6a5b71498228e902c4b9f51c1f7900d49fabf71f9a650c6120e0d0
    commands:
      - python3 scripts/check_mojibake.py

  test-provision:
    image: homelab/ci-python:3.15
    commands:
      - pip install -r provision/requirements.txt pytest==9.1.1
      - pytest tests/test_provision.py -v


  # Container image: validated on PRs, pushed to Harbor from main.
  image-check:
    image: woodpeckerci/plugin-kaniko:2.3.4@sha256:497071c44ffd0c24d6e3e3e49993c33a6544eb30a5e3f887c031d2b643238432
    settings:
      dry-run: true
      registry: harbor.hieronymi-ludwig.de
      repo: homelab/hibiscus
      dockerfile: Dockerfile
      context: .
    when:
      - event: pull_request
        # Docs-only changes do not need an image build.
        path:
          exclude: ["**/*.md", "*.md", "LICENSE*", "docs/**"]

  image:
    image: woodpeckerci/plugin-kaniko:2.3.4@sha256:497071c44ffd0c24d6e3e3e49993c33a6544eb30a5e3f887c031d2b643238432
    settings:
      registry: harbor.hieronymi-ludwig.de
      repo: homelab/hibiscus
      dockerfile: Dockerfile
      context: .
      tags:
        - latest
        - "${CI_COMMIT_SHA:0:8}"
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      cache: true
      cache-repo: homelab/hibiscus-cache
    when:
      - event: [push, manual]
        branch: ${CI_REPO_DEFAULT_BRANCH}
        # Docs-only changes do not need an image build.
        path:
          exclude: ["**/*.md", "*.md", "LICENSE*", "docs/**"]
