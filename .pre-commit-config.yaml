---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: fix-byte-order-marker
  - repo: local
    hooks:
      - id: check-mojibake
        name: no cat -v notation (M-...) in text files
        entry: python3 scripts/check_mojibake.py
        language: system
        types: [text]
        exclude: ^scripts/check_mojibake\.py$
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets in staged changes; skipped if gitleaks is not installed)
        entry: sh -c 'command -v gitleaks >/dev/null 2>&1 || exit 0; exec gitleaks protect --staged --redact --no-banner'
        language: system
        pass_filenames: false
